name: Telegram Video Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run mirror
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          SOURCE_GROUP: ${{ secrets.SOURCE_GROUP }}
          TARGET_GROUP: ${{ secrets.TARGET_GROUP }}
          PYTHONUNBUFFERED: "1"
          # TIME_BUDGET_MIN: "240"
          # MAX_VIDEOS_PER_RUN: "1000"
          # DELAY_SECONDS: "2"
        run: python -u mirror.py

      - name: Commit progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress.json
          if git diff --cached --quiet; then
            echo "No progress changes"
          else
            git commit -m "progress: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
