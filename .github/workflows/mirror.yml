name: Telegram Mirror Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          RATE_LIMIT: "2"
          MAX_DOWNLOAD_WORKERS: "3"   # keep low — runner has ~14GB disk
          IDLE_EXIT_MIN: "20"
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py

      - name: Commit resume state
        if: always()          # saves task.json even if the job was killed by timeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "resume state: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
